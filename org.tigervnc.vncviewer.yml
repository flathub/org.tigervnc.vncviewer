app-id: org.tigervnc.vncviewer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: vncviewer
rename-icon: tigervnc
rename-desktop-file: vncviewer.desktop
finish-args:
  - --persist=vnc   # For saved connection files.
  - --share=ipc
  - --share=network
  - --socket=x11
cleanup:
  - '/bin/fltk-config'
  - '/bin/fluid'
  - '/bin/vncconfig'
  - '/bin/vncpasswd'
  - '/bin/x0vncserver'
  - '/etc'
  - '/include'
  - '/lib/libpam*'
  - '/lib/pkgconfig'
  - '/lib/security'
  - '/lib/systemd'
  - '/libexec'
  - '/sbin'
  - '/share/doc'
  - '/share/fltk'
  - '/share/man'
  - '/share/mime'
  - '/share/runtime'
  - 'Linux-PAM.mo'
  - 'fluid.desktop'
  - 'fluid.png'
  - '*.a'
modules:
  - name: fltk
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fltk/fltk.git
        tag: release-1.3.9
        commit: a66273e72621887fcbd0ee5dca2dd133356d5d8a

  - name: pam
    buildsystem: autotools
    config-opts:
      - --disable-doc
    post-install:
      - cp -r libpam/include/* $FLATPAK_DEST/include
    sources:
      - type: git
        url: https://github.com/linux-pam/linux-pam.git
        tag: v1.6.1
        commit: 9438e084e2b318bf91c3912c0b8ff056e1835486

  - name: vncviewer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_CXX_FLAGS=-lpng16
    post-install:
      - install -Dm644 org.tigervnc.vncviewer.metainfo.xml.in $FLATPAK_DEST/share/metainfo/org.tigervnc.vncviewer.metainfo.xml
    sources:
      - type: git
        url: https://github.com/TigerVNC/tigervnc.git
        tag: v1.16.2
        commit: b555312d70d7ff017f866649a7e7167af4eb8fca

      - type: file
        url: https://raw.githubusercontent.com/TigerVNC/tigervnc/b555312d70d7ff017f866649a7e7167af4eb8fca/vncviewer/org.tigervnc.vncviewer.metainfo.xml.in
        sha256: 4e54acddd16c216d65c2e86bf5b7b69d03b6565344012280a61c4e01742364a6
      - type: patch
        path: metainfo.patch
