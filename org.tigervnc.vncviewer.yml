app-id: org.tigervnc.vncviewer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: vncviewer
rename-icon: tigervnc
rename-desktop-file: vncviewer.desktop
finish-args:
  - --persist=vnc   # For saved connection files.
  - --share=ipc
  - --share=network
  - --socket=x11
cleanup:
  - '/bin/fltk-config'
  - '/bin/fluid'
  - '/bin/vncconfig'
  - '/bin/vncpasswd'
  - '/bin/w0vncserver*'
  - '/bin/x0vncserver'
  - '/etc'
  - '/include'
  - '/lib/libpam*'
  - '/lib/pkgconfig'
  - '/lib/security'
  - '/lib/systemd'
  - '/libexec'
  - '/sbin'
  - '/share/doc'
  - '/share/fltk'
  - '/share/man'
  - '/share/mime'
  - '/share/pam'
  - '/share/runtime'
  - 'Linux-PAM.mo'
  - 'fluid.desktop'
  - 'fluid.png'
modules:
  - name: fltk
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fltk/fltk.git
        tag: release-1.3.11
        commit: 702172a951a2bb4f25afe31008ef3fcbb5bfb92f
  - name: pam
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dexamples=false
      - -Dsystemdunitdir=/app/lib/systemd/system
      - -Dvendordir=/app/share/pam
    sources:
      - type: git
        url: https://github.com/linux-pam/linux-pam.git
        tag: v1.7.3
        commit: 28fce1fd55b003fec90f34e5bc785e9439b216f2
  - name: vncviewer
    buildsystem: cmake-ninja
    config-opts:
      - "-DCMAKE_CXX_FLAGS=-lpng16"
    post-install:
      - install -Dm644 org.tigervnc.vncviewer.metainfo.xml $FLATPAK_DEST/share/metainfo/org.tigervnc.vncviewer.metainfo.xml
    sources:
      - type: git
        url: https://github.com/TigerVNC/tigervnc.git
        tag: v1.16.2
        commit: b555312d70d7ff017f866649a7e7167af4eb8fca
      # Backport of upstream be6e25fc; drop once included in a release.
      - type: patch
        path: nettle4-compat.patch
      - type: file
        url: https://raw.githubusercontent.com/TigerVNC/tigervnc/b555312d70d7ff017f866649a7e7167af4eb8fca/vncviewer/org.tigervnc.vncviewer.metainfo.xml.in
        dest-filename: org.tigervnc.vncviewer.metainfo.xml
        sha256: 4e54acddd16c216d65c2e86bf5b7b69d03b6565344012280a61c4e01742364a6
      - type: patch
        path: metainfo.patch
        strip-components: 0
